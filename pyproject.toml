[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-least-privilege-enforcer"
version = "0.1.0"
description = "Enforces dynamic permission boundaries and role-based tool execution policies across autonomous subagents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-least-privilege-enforcer = "agent_least_privilege_enforcer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_least_privilege_enforcer*"]
